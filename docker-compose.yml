services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-telegram-agent
    restart: unless-stopped

    # User mapping to ensure persistent files stay editable on host
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}

      # ------------------------------------------------------------------------
      # Telegram Bot Configuration
      # 1. Create a bot with @BotFather on Telegram to get your token.
      # 2. Get your numeric ID from @userinfobot to restrict access to yourself.
      # ------------------------------------------------------------------------
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-your_telegram_bot_token_here}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-your_numeric_telegram_user_id}

      # ------------------------------------------------------------------------
      # LLM Provider Keys (fill at least one)
      # ------------------------------------------------------------------------
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    volumes:
      # Persistent storage: configuration, memories, sessions, and custom skills
      - ./data:/opt/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # Telegram uses outbound HTTPS long-polling to api.telegram.org.
    # No incoming ports need to be exposed on your Hetzner VPS firewall!
    # ports:
    #   - "127.0.0.1:8642:8642" # Optional local OpenAI-compatible API

    # Limit container writable storage layer to 5GB
    storage_opt:
      size: "5G"

    # Memory limit to prevent Out-Of-Memory crashes on VPS
    deploy:
      resources:
        limits:
          memory: 4096M

    # Prevent logs from filling up your VPS disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
