services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-telegram-agent
    restart: unless-stopped

    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    volumes:
      # Persistent storage: memories, sessions, skills
      - ./data:/opt/data
      # Pre-configured model provider so hermes setup is not required
      - ./config.yaml:/opt/data/config.yaml:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # Telegram uses outbound HTTPS long-polling — no inbound ports needed
    deploy:
      resources:
        limits:
          memory: 4096M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
