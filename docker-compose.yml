services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-telegram-agent
    restart: unless-stopped

    # Allocate a pseudo-TTY so main-hermes does not exit with
    # "Warning: Input is not a terminal (fd=0)" and take the whole container down.
    # This keeps the container alive so you can run `hermes setup` from Dokploy terminal.
    tty: true
    stdin_open: true

    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}

    volumes:
      # Persistent storage: memories, sessions, skills, and config written by hermes setup.
      # Docker-managed named volume so the host bind path cannot go missing/empty.
      - hermes-data:/opt/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # Telegram uses outbound HTTPS long-polling — no inbound ports needed
    deploy:
      resources:
        limits:
          memory: 4096M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Managed by Docker/Dokploy — do not bind to a host path.
  hermes-data:
