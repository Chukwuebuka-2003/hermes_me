services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-telegram-agent
    restart: unless-stopped

    # User mapping to ensure persistent files stay editable on host
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    volumes:
      # Persistent storage: configuration, memories, sessions, and custom skills
      - ./data:/opt/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # Telegram uses outbound HTTPS long-polling to api.telegram.org.
    # No incoming ports need to be exposed on your Hetzner VPS firewall!
    # ports:
    #   - "127.0.0.1:8642:8642" # Optional local OpenAI-compatible API


    # Memory limit to prevent Out-Of-Memory crashes on VPS
    deploy:
      resources:
        limits:
          memory: 4096M

    # Prevent logs from filling up your VPS disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
